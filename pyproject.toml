[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compliance-layer"
version = "0.1.0"
description = "AI Compliance Data Layer: flag and mask personal, sensitive and security-sensitive data in AI traffic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["spacy>=3.7"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.0", "altair>=5.0"]

[tool.setuptools]
packages = ["ai_compliance", "compliance", "evaluators"]
